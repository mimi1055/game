<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#27382d" />
  <title>小煎餅的尋找敖尹大冒險</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell" aria-label="小煎餅的尋找敖尹大冒險遊戲">
    <canvas id="game" aria-label="遊戲畫面"></canvas>

    <header class="hud">
      <div class="score-box">
        <div class="score-pill" aria-live="polite">
          <span class="pancake-icon">◎</span>
          <span id="score">0</span>
        </div>
        <div id="hearts" class="hearts" aria-label="剩餘愛心">❤❤❤</div>
      </div>
      <div class="distance"><span id="distance">0</span> / <span id="goalDistance">90</span> m</div>
      <button id="pauseBtn" class="icon-button" aria-label="暫停遊戲">Ⅱ</button>
    </header>
    <div class="stage-track">
      <div id="stageLabel" class="stage-label">STAGE 01</div>
      <div class="progress-bar" aria-hidden="true"><div id="progressFill" class="progress-fill"></div><span class="progress-goal">🐺</span></div>
    </div>
    <div id="stageBanner" class="stage-banner" aria-live="polite"></div>

    <section id="startScreen" class="overlay is-visible">
      <div class="card start-card">
        <p class="eyebrow">森林尋找大作戰</p>
        <h1 class="adventure-title">🥞小煎餅的<br><span>尋找敖尹大冒險🐺</span></h1>
        <p class="intro">敖尹去哪裡了！？穿過森林、循著足跡找到他！</p>
        <div class="legend">
          <span>🥞 +10</span><span>🫐 +5</span><span>🌰 +1</span>
        </div>
        <button id="continueBtn" class="primary-button">繼續冒險</button>
        <button id="stageSelectBtn" class="secondary-button">選擇關卡</button>
        <label class="background-picker">測試背景<select class="background-select" aria-label="首頁背景選擇"></select><small class="background-status" role="status"></small></label>
        <p class="hint">共 3 顆 ❤，撞到石頭、木頭會少一顆<br>點左／右半邊換線，按下方按鈕跳躍<br>電腦：← → 換線、空白鍵跳躍</p>
        <button class="text-button sound-toggle">🔊 音效：開</button>
      </div>
    </section>

    <section id="stageSelectScreen" class="overlay">
      <div class="card stage-card">
        <p class="eyebrow">冒險地圖</p>
        <h2>選擇關卡</h2>
        <div id="stageGrid" class="stage-grid"></div>
        <button id="stageBackBtn" class="text-button">返回首頁</button>
      </div>
    </section>

    <section id="pauseScreen" class="overlay">
      <div class="card compact-card">
        <p class="eyebrow">先喘口氣</p>
        <h2>遊戲暫停</h2>
        <button id="resumeBtn" class="primary-button">繼續前進</button>
        <button id="restartPauseBtn" class="secondary-button">重新開始</button>
        <label class="background-picker">測試背景<select class="background-select" aria-label="暫停背景選擇"></select><small class="background-status" role="status"></small></label>
        <button id="pauseHomeBtn" class="text-button">返回選擇關卡</button>
        <button class="text-button sound-toggle">🔊 音效：開</button>
      </div>
    </section>

    <section id="gameOverScreen" class="overlay">
      <div class="card compact-card">
        <p class="eyebrow">旅程結束</p>
        <h2>跑了 <span id="finalDistance">0</span> 公尺</h2>
        <div class="final-score"><small>總分</small><strong id="finalScore">0</strong></div>
        <p id="bestText" class="best-text"></p>
        <button id="restartBtn" class="primary-button">再跑一次</button>
        <button id="gameOverHomeBtn" class="text-button">返回選擇關卡</button>
      </div>
    </section>

    <section id="finishScreen" class="overlay">
      <div class="card compact-card finish-card">
        <p id="completeCode" class="eyebrow">STAGE CLEAR</p>
        <div class="wolf-found">🐺</div>
        <h2 id="completeTitle">關卡完成！</h2>
        <div id="starResult" class="star-result">☆ ☆ ☆</div>
        <p id="collectText" class="collect-text"></p>
        <p id="completeMessage">下一段森林道路已經開啟。</p>
        <div class="final-score"><small>總分</small><strong id="winScore">0</strong></div>
        <button id="nextStageBtn" class="primary-button">前往下一關</button>
        <button id="finishHomeBtn" class="secondary-button">選擇關卡</button>
      </div>
    </section>

    <div id="toast" class="toast" aria-live="polite"></div>

    <button id="jumpBtn" class="jump-button" aria-label="跳起"><span>↑</span><small>JUMP</small></button>
  </main>
  <script src="game.js"></script>
</body>
</html>
